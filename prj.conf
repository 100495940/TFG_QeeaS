# ARCHIVO CON CONFIGURACIONES DE ZEPHYR PARA EL PROYECTO

# ACTIVAR EL TRNG DEL ESP32-C6
CONFIG_ENTROPY_GENERATOR=y

# DIRIGIR PRINTF/FWRITE A LA CONSOLA SERIAL (PUERTO USB)
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# SUBSISTEMA DE RED Y WI-FI
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# GESTIÓN EVENTOS DE RED
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# SOCKETS PARA QUE ZENOH-PICO PUEDA USAR TCP/UDP
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# TLS/mbedTLS PARA QUE ZENOH-PICO PUEDA USAR TLS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_APP_LINK_WITH_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

# Módulos necesarios para TLS cliente y certificados
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_X509_USE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_ASN1_PARSE_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_BASE64_C=y
CONFIG_MBEDTLS_PK_PARSE_C=y
CONFIG_MBEDTLS_ENTROPY_C=n
CONFIG_MBEDTLS_CTR_DRBG_C=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y

# Necesario para ECDHE:
# la ESP32 debe poder generar claves ECC efímeras para el handshake TLS.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y

# Ciphersuite TLS 1.2 compatible con ECDHE-RSA
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# PSA CRYPTO: TIPOS Y ALGORITMOS NECESARIOS PARA RSA/ECC PUBLIC KEYS
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PSS=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_GCM=y

# Tamaño máximo de registro TLS recibido/enviado.
# Necesario para evitar MBEDTLS_ERR_SSL_INVALID_RECORD durante el handshake.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384

# AMPLIACIÓN DE MEMORIA PARA LOS PAQUETES DE RED
CONFIG_HEAP_MEM_POOL_SIZE=196698
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# HABILITAR LOGS DE RED PARA VER NUESTRA IP EN LA TERMINAL
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# ACTIVAR SOPORTE DE HILOS POSIX PARA COMPILAR ZENOH-PICO
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=8

# DESACTVIAR WARNINGS COMO ERRORES
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
CONFIG_COMPILER_OPT="-Wno-error=unused-variable -Wno-error=unused-parameter -Wno-error=unused-function"