# ARCHIVO CON CONFIGURACIONES DE ZEPHYR PARA EL PROYECTO

# ACTIVAR EL TRNG DEL ESP32-C6
CONFIG_ENTROPY_GENERATOR=y

# DIRIGIR PRINTF/FWRITE A LA CONSOLA SERIAL (PUERTO USB)
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# SUBSISTEMA DE RED Y WI-FI
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# GESTIÓN EVENTOS DE RED
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# SOCKETS PARA QUE ZENOH-PICO PUEDA USAR TCP/UDP
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# AMPLIACIÓN DE MEMORIA PARA LOS PAQUETES DE RED
CONFIG_HEAP_MEM_POOL_SIZE=196698
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# HABILITAR LOGS DE RED PARA VER NUESTRA IP EN LA TERMINAL
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# ACTIVAR SOPORTE DE HILOS POSIX PARA COMPILAR ZENOH-PICO
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=8